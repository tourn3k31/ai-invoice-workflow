# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.NET Core app to Azure Web App - ai-invoice-api-daniel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Restore backend
        run: dotnet restore backend/InvoiceWorkflow.Api.csproj

      - name: Build backend
        run: dotnet build backend/InvoiceWorkflow.Api.csproj --configuration Release --no-restore

      - name: Publish backend
        run: dotnet publish backend/InvoiceWorkflow.Api.csproj --configuration Release --no-build --output "${{ github.workspace }}/publish"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_40DEFB6F59604DB0B76847789E352627 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1C255C3476E1444F91191EB0FF3A2EC6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_315C1E234F2347A9899A8D583BF78449 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ai-invoice-api-daniel
          slot-name: Production
          package: ./publish
          
