name: Build and deploy ASP.NET Core app to Azure Web App - ai-invoice-api-daniel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Restore backend
        run: dotnet restore backend/InvoiceWorkflow.Api.csproj

      - name: Build backend
        run: dotnet build backend/InvoiceWorkflow.Api.csproj --configuration Release --no-restore

      - name: Publish backend
        run: dotnet publish backend/InvoiceWorkflow.Api.csproj --configuration Release --no-build --output "${{ github.workspace }}/publish"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ai-invoice-api-daniel
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
